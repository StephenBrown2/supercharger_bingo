name: supercharger_bingo
description: "Fast check-in interface for supercharging.life - track Tesla Supercharger visits"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # Map display
  flutter_map: ^8.2.2
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1
  flutter_map_location_marker: ^10.1.0

  # Local database (Drift with SQLite)
  drift: ^2.22.1
  drift_flutter: ^0.3.1
  path_provider: ^2.1.4
  path: ^1.9.0

  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Authentication
  webview_flutter: ^4.10.0
  # v10 (linux 3.x) drops the vendored json.hpp that fails -Werror on clang 18+.
  flutter_secure_storage: ^11.2.0

  # Location
  geolocator: ^14.0.2

  # Background tasks & notifications
  workmanager: ^0.10.10
  flutter_local_notifications: ^23.0.0

  # Excel parsing for XLSX import
  excel: ^4.0.6

  # Connectivity detection
  connectivity_plus: ^7.0.0

  # Timezone handling
  timezone: ^0.11.2
  webview_win_floating: ^3.0.2
  lat_lng_to_timezone: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13
  # Used by tests to load libsqlite3 for VM-based drift databases.
  sqlite3: ^3.9.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/tz/
